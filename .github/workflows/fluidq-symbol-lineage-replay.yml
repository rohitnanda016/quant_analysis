name: FLUID-Q Ticker-Lineage Replay

# This workflow waits for the current repair chain to checkpoint, then uses the
# current code to replay only missing pairs whose historical ticker changed.
on:
  push:
    branches: [v1.2-factor-attribution]
    paths:
      - ".github/workflows/fluidq-symbol-lineage-replay.yml"
      - "data/reference/nse_historical_symbol_changes.csv"
      - "data/reference/verified_no_trade_evidence.csv"
      - "data/reference/approved_price_gap_exclusions.csv"
      - "data/input/verified_corporate_events.csv"
      - "tests/test_price_gap_bhavcopy_parser.py"
      - "scripts/repair_missing_pairs_security_history.py"
      - "scripts/repair_price_gaps_bhavcopy.py"
      - "scripts/audit_price_quality.py"
      - "scripts/audit_price_gap_readiness.py"
      - "scripts/fetch_nse_corporate_actions.py"
      - "scripts/reconcile_extreme_returns.py"
      - "scripts/build_price_adjustment_actions.py"
      - "scripts/apply_verified_adjustments.py"
      - "scripts/audit_post_adjustment.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fluidq-symbol-lineage-replay-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lineage-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for the latest price-repair chain to publish a complete checkpoint
        id: checkpoint_source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import io, json, os, sys, time, zipfile
          import requests

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
          api = f"https://api.github.com/repos/{repo}"
          deadline = time.time() + 150 * 60
          last_seen = None
          idle_polls = 0

          while time.time() < deadline:
              # Query the repair workflow directly. The global actions/runs
              # endpoint is capped at the newest 100 runs; repeated fast-validation
              # runs can push the latest repair checkpoint out of that page and
              # leave this replay polling until timeout.
              response = requests.get(
                  f"{api}/actions/workflows/fluidq-targeted-price-repair.yml/runs"
                  "?per_page=20&branch=v1.2-factor-attribution",
                  headers=headers, timeout=30
              )
              response.raise_for_status()
              runs = [r for r in response.json().get("workflow_runs", [])
                      if r.get("name") == "FLUID-Q Targeted Price Gap Repair"]
              if not runs:
                  print("No targeted repair run is visible yet; waiting.", flush=True)
                  time.sleep(30)
                  continue
              runs = sorted(runs, key=lambda r: r.get("run_number", 0), reverse=True)
              run = runs[0]
              run_id = run["id"]
              if run_id != last_seen:
                  print(f"Latest repair run #{run.get('run_number')} ID {run_id}: "
                        f"{run.get('status')} / {run.get('conclusion')}", flush=True)
                  last_seen = run_id

              # Never fall back to an older completed checkpoint: it may belong to
              # a stale target inventory or predate newly approved exclusions.
              # The targeted-repair workflow dispatches the next batch itself when
              # the latest checkpoint is incomplete.
              if run.get("status") != "completed":
                  idle_polls = 0
                  time.sleep(30)
                  continue

              artifacts_response = requests.get(
                  f"{api}/actions/runs/{run_id}/artifacts",
                  headers=headers, timeout=30
              )
              artifacts_response.raise_for_status()
              artifact = next((x for x in artifacts_response.json().get("artifacts", [])
                               if x.get("name") == f"fluidq-price-repair-checkpoint-{run_id}"
                               and not x.get("expired")), None)
              if not artifact:
                  idle_polls += 1
                  if idle_polls >= 10:
                      raise RuntimeError(
                          f"Latest repair run {run_id} has no checkpoint artifact after 5 minutes. "
                          "Refusing to use a stale checkpoint from an older run; inspect the repair "
                          "run logs and restore/re-dispatch the matching checkpoint."
                      )
                  print(f"Latest repair run {run_id} has no checkpoint artifact yet; waiting.", flush=True)
                  time.sleep(30)
                  continue

              download = requests.get(artifact["archive_download_url"],
                                      headers=headers, timeout=120)
              download.raise_for_status()
              with zipfile.ZipFile(io.BytesIO(download.content)) as archive:
                  checkpoint_name = next((n for n in archive.namelist()
                                           if n.endswith("bhavcopy_repair_checkpoint.json")), None)
                  if not checkpoint_name:
                      raise RuntimeError(f"Checkpoint JSON missing in latest repair artifact for run {run_id}")
                  checkpoint = json.loads(archive.read(checkpoint_name))
              status = checkpoint.get("status")
              if status == "complete":
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write(f"run_id={run_id}\n")
                      output.write(f"checkpoint_status={status}\n")
                  print(f"Using latest complete checkpoint from run {run_id}; "
                        f"{checkpoint.get('completed_dates')} / {checkpoint.get('total_dates')} dates completed; "
                        f"{checkpoint.get('unresolved_absence_pairs')} absences remain for explicit audit.",
                        flush=True)
                  sys.exit(0)

              idle_polls += 1
              if idle_polls >= 10:
                  raise RuntimeError(
                      f"Latest repair run {run_id} checkpoint remains {status} after 5 minutes. "
                      "No stale checkpoint will be substituted; inspect the repair workflow dispatch chain."
                  )
              print(f"Latest repair run {run_id} checkpoint is {status}; waiting for the next dispatched batch.", flush=True)
              time.sleep(30)

          raise TimeoutError("Repair chain did not publish a complete checkpoint within 150 minutes.")
          PY

      - name: Download finalized raw dataset
        uses: actions/download-artifact@v5
        with:
          name: fluidq-finalized-full-history-36875371038
          path: base_artifact
          run-id: 36875371038
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download latest repair checkpoint
        uses: actions/download-artifact@v5
        with:
          name: fluidq-price-repair-checkpoint-${{ steps.checkpoint_source.outputs.run_id }}
          path: repair_checkpoint
          run-id: ${{ steps.checkpoint_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore dataset and checkpoint
        run: |
          mkdir -p data/raw data/input data/processed/adjusted results/price_quality
          cp base_artifact/data/raw/stage_a_prices.csv data/raw/stage_a_prices.csv
          cp base_artifact/data/input/nifty500_membership.csv data/input/nifty500_membership.csv
          cp repair_checkpoint/bhavcopy_repair_checkpoint.json results/price_quality/
          cp repair_checkpoint/bhavcopy_repair_additions.csv results/price_quality/
          cp repair_checkpoint/bhavcopy_repair_absences.csv results/price_quality/
          cp data/reference/verified_no_trade_evidence.csv data/input/verified_no_trade_dates.csv

      - name: Replay unresolved pairs affected by verified ticker changes
        id: lineage_repair
        run: |
          python scripts/repair_price_gaps_bhavcopy.py \
            --prices data/raw/stage_a_prices.csv \
            --out data/raw/stage_a_prices_repaired.csv \
            --no-trade-out data/input/verified_no_trade_dates.csv \
            --exceptions-out data/input/unresolved_gap_exceptions.csv \
            --report results/price_quality/bhavcopy_gap_repair.json \
            --start 2014-01-01 --end 2026-08-31 \
            --min-gap-sessions 10 --sleep 0.15 --retries 3 --workers 3 \
            --min-bhavcopy-eq-rows 500 --max-dates 600 --resume
          mv data/raw/stage_a_prices_repaired.csv data/raw/stage_a_prices.csv

      - name: Cross-check residual gaps against NSE security-wise history
        id: security_history_audit
        continue-on-error: true
        run: |
          python scripts/repair_missing_pairs_security_history.py \
            --prices data/raw/stage_a_prices.csv \
            --exceptions data/input/unresolved_gap_exceptions.csv \
            --no-trade data/input/verified_no_trade_dates.csv \
            --repair-report results/price_quality/bhavcopy_gap_repair.json \
            --symbol-map data/input/verified_symbol_map.csv \
            --symbol-map-supplement data/reference/nse_historical_symbol_changes.csv \
            --audit-report results/price_quality/security_history_gap_audit.json

      - name: Audit raw price quality
        id: raw_audit
        continue-on-error: true
        run: python scripts/audit_price_quality.py --prices data/raw/stage_a_prices.csv --outdir results/price_quality

      - name: Fetch NSE corporate actions
        id: fetch_actions
        continue-on-error: true
        run: |
          python scripts/fetch_nse_corporate_actions.py \
            --start 2014-01-01 \
            --end 2026-08-31 \
            --out data/input/nse_corporate_actions_2014_2026.csv \
            --raw-archive-dir results/price_quality/nse_corporate_actions_raw

      - name: Reconcile extreme returns against actions
        id: reconcile_actions
        if: ${{ steps.raw_audit.outcome == 'success' && steps.fetch_actions.outcome == 'success' }}
        continue-on-error: true
        run: python scripts/reconcile_extreme_returns.py --extremes results/price_quality/extreme_returns_raw.csv --actions data/input/nse_corporate_actions_2014_2026.csv --symbol-map data/input/verified_symbol_map.csv --out results/price_quality/extreme_return_reconciliation.csv

      - name: Build split and bonus adjustment table
        id: build_adjustments
        if: ${{ steps.fetch_actions.outcome == 'success' }}
        continue-on-error: true
        run: python scripts/build_price_adjustment_actions.py --actions data/input/nse_corporate_actions_2014_2026.csv --symbol-map data/input/verified_symbol_map.csv --supplemental data/input/verified_manual_corporate_actions.csv --out data/input/verified_price_adjustment_actions.csv

      - name: Apply historical price adjustments
        id: apply_adjustments
        if: ${{ steps.build_adjustments.outcome == 'success' }}
        continue-on-error: true
        run: python scripts/apply_verified_adjustments.py --prices data/raw/stage_a_prices.csv --actions data/input/verified_price_adjustment_actions.csv --symbol-map data/input/verified_symbol_map.csv --out data/processed/adjusted/prices_adjusted_split_bonus.csv

      - name: Audit post-adjustment continuity
        id: post_adjustment_audit
        if: ${{ steps.apply_adjustments.outcome == 'success' && steps.reconcile_actions.outcome == 'success' }}
        continue-on-error: true
        run: python scripts/audit_post_adjustment.py --extremes results/price_quality/extreme_returns_raw.csv --reconciliation results/price_quality/extreme_return_reconciliation.csv --adjusted data/processed/adjusted/prices_adjusted_split_bonus.csv --outdir results/price_quality/post_adjustment

      - name: Run price-gap readiness gate
        id: gap_gate
        if: always()
        run: |
          python scripts/audit_price_gap_readiness.py \
            --prices data/raw/stage_a_prices.csv \
            --repair-report results/price_quality/bhavcopy_gap_repair.json \
            --verified-no-trade data/input/verified_no_trade_dates.csv \
            --price-quality-summary results/price_quality/price_quality_summary.json \
            --post-adjustment-summary results/price_quality/post_adjustment/post_adjustment_summary.json \
            --symbol-map data/input/verified_symbol_map.csv \
            --report results/price_quality/price_gap_readiness.json

      - name: Upload lineage replay diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluidq-symbol-lineage-replay-${{ github.run_id }}
          path: |
            results/price_quality/
            data/input/unresolved_gap_exceptions.csv
            data/input/verified_no_trade_dates.csv
            data/processed/adjusted/prices_adjusted_split_bonus.csv
          if-no-files-found: warn
          retention-days: 30
