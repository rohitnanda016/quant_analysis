name: NSE Security History Evidence Audit

on:
  push:
    branches:
      - v1.2-factor-attribution
    paths:
      - "scripts/audit_nse_security_history.py"
      - ".github/workflows/nse-security-history-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nse-security-history-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retrieve-official-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install retrieval dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Query exact-date NSE security history
        run: python scripts/audit_nse_security_history.py

      - name: Upload raw responses and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-security-history-audit-${{ github.run_id }}
          path: results/nse_security_history_audit/
          if-no-files-found: warn
          retention-days: 30
