name: FLUID-Q V1.1 Sector Constrained

on:
  workflow_dispatch:
    inputs:
      integrity_run_id:
        description: "Price-integrity workflow run"
        required: true
        default: "37038236847"

permissions:
  contents: read
  actions: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download price-integrity artifact
        uses: actions/download-artifact@v5
        with:
          name: fluidq-price-integrity-${{inputs.integrity_run_id || '37038236847'}}
          path: integrity_artifact
          run-id: ${{inputs.integrity_run_id || '37038236847'}}
          github-token: ${{secrets.GITHUB_TOKEN}}
      - name: Restore backtest inputs
        run: |
          mkdir -p data/processed/adjusted data/input results/backtest_v11
          cp integrity_artifact/data/processed/adjusted/prices_adjusted_split_bonus.csv data/processed/adjusted/
          cp integrity_artifact/data/input/nifty500_membership.csv data/input/
      - name: Build historical sector membership
        run: |
          python scripts/build_historical_sector_membership.py             --out data/input/historical_sector_membership.csv
      - name: Run FLUID-Q V1.1 sector constrained backtest
        run: |
          python scripts/run_fluidq_backtest.py             --prices data/processed/adjusted/prices_adjusted_split_bonus.csv             --membership data/input/nifty500_membership.csv             --events data/input/verified_corporate_events.csv             --sector-membership data/input/historical_sector_membership.csv             --sector-constrained             --outdir results/backtest_v11
      - name: Validate FLUID-Q V1.1 backtest
        run: |
          python scripts/validate_fluidq_backtest.py
      - name: Upload V1.1 results
        uses: actions/upload-artifact@v4
        with:
          name: fluidq-v11-sector-constrained-${{github.run_id}}
          path: results/backtest_v11/
          retention-days: 30
