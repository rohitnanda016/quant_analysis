name: FLUID-Q V1.1 Sector Constrained

on:
  workflow_dispatch:
    inputs:
      integrity_run_id:
        description: "Price-integrity artifact run ID that passed the price-gap gate"
        required: true
permissions:
  contents: read
  actions: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download price-integrity artifact
        uses: actions/download-artifact@v5
        with:
          name: fluidq-price-integrity-${{ inputs.integrity_run_id }}
          path: integrity_artifact
          run-id: ${{ inputs.integrity_run_id }}
          github-token: ${{secrets.GITHUB_TOKEN}}
      - name: Restore backtest inputs
        run: |
          test -s integrity_artifact/data/input/verified_no_trade_dates.csv
          test -s integrity_artifact/data/input/verified_symbol_map.csv
          test -s integrity_artifact/results/price_quality/price_gap_readiness.json
          python - <<'PY'
          import json
          r = json.load(open("integrity_artifact/results/price_quality/price_gap_readiness.json"))
          if r.get("status") != "PASS_PRICE_GAPS" or r.get("price_gap_integrity") != "PASS":
              raise SystemExit("Refusing to backtest: price-gap readiness gate did not pass")
          if int(r.get("repair", {}).get("minimum_valid_bhavcopy_eq_rows", 0) or 0) < 500:
              raise SystemExit("Refusing to run: daily archive completeness threshold is missing/failed")
          if "NSEArchives.bhavcopy_raw" not in str(r.get("repair", {}).get("archive_api", "")):
              raise SystemExit("Refusing to run: readiness report predates the UDiFF-capable official archive adapter")
          print("Price-gap gate passed; result remains provisional.")
          PY
          mkdir -p data/processed/adjusted data/input results/backtest_v11
          cp integrity_artifact/data/processed/adjusted/prices_adjusted_split_bonus.csv data/processed/adjusted/
          cp integrity_artifact/data/input/nifty500_membership.csv data/input/
          cp integrity_artifact/data/input/verified_no_trade_dates.csv data/input/verified_no_trade_dates.csv
          cp integrity_artifact/data/input/verified_symbol_map.csv data/input/verified_symbol_map.csv
      - name: Build historical sector membership
        run: |
          python scripts/build_historical_sector_membership.py             --out data/input/historical_sector_membership.csv
      - name: Run FLUID-Q V1.1 sector constrained backtest
        run: |
          python scripts/run_fluidq_backtest.py             --prices data/processed/adjusted/prices_adjusted_split_bonus.csv             --membership data/input/nifty500_membership.csv             --events data/input/verified_corporate_events.csv             --sector-membership data/input/historical_sector_membership.csv             --sector-constrained             --outdir results/backtest_v11
      - name: Validate FLUID-Q V1.1 backtest
        run: |
          python scripts/validate_fluidq_backtest.py
      - name: Upload V1.1 results
        uses: actions/upload-artifact@v4
        with:
          name: fluidq-v11-sector-constrained-${{github.run_id}}
          path: results/backtest_v11/
          retention-days: 30
