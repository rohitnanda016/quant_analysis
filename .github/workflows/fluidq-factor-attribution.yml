name: FLUID-Q V1 Factor Attribution
# Research-only attribution workflow; no production parameters are changed.
# Parameter-neutral factor ablation: each test removes one factor and renormalizes
# the remaining original weights. No thresholds, universe, timing, or costs change.

on:
  workflow_dispatch:
    inputs:
      integrity_run_id:
        description: "Price-integrity artifact run ID that passed the price-gap gate"
        required: true
permissions:
  contents: read
  actions: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - name: baseline
            weights: "0.20,0.15,0.20,0.20,0.15"
          - name: no_6m_momentum
            weights: "0,0.1875,0.25,0.25,0.1875"
          - name: no_12m_momentum
            weights: "0.2352941176,0,0.2352941176,0.2352941176,0.1764705882"
          - name: no_relative_strength
            weights: "0.25,0.1875,0,0.25,0.1875"
          - name: no_trend
            weights: "0.25,0.1875,0.25,0,0.1875"
          - name: no_risk_adjusted_momentum
            weights: "0.2352941176,0.1764705882,0.2352941176,0.2352941176,0"
          - name: equal_weight_factors
            weights: "0.20,0.20,0.20,0.20,0.20"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download price-integrity artifact
        uses: actions/download-artifact@v5
        with:
          name: fluidq-price-integrity-${{ inputs.integrity_run_id }}
          path: integrity_artifact
          run-id: ${{ inputs.integrity_run_id }}
          github-token: ${{secrets.GITHUB_TOKEN}}

      - name: Restore backtest inputs
        run: |
          test -s integrity_artifact/data/input/verified_no_trade_dates.csv
          test -s integrity_artifact/results/price_quality/price_gap_readiness.json
          python - <<'PY'
          import json
          p = "integrity_artifact/results/price_quality/price_gap_readiness.json"
          r = json.load(open(p))
          if r.get("status") != "PASS_PRICE_GAPS" or r.get("price_gap_integrity") != "PASS":
              raise SystemExit("Refusing to backtest: price-gap readiness gate did not pass")
          print("Price-gap gate passed; research remains provisional:", r.get("limitations"))
          PY
          mkdir -p data/processed/adjusted data/input results/factor_attribution
          cp integrity_artifact/data/processed/adjusted/prices_adjusted_split_bonus.csv data/processed/adjusted/
          mkdir -p data/input
          cp integrity_artifact/data/input/verified_no_trade_dates.csv data/input/verified_no_trade_dates.csv
          cp integrity_artifact/data/input/nifty500_membership.csv data/input/
          cp integrity_artifact/data/input/verified_no_trade_dates.csv data/input/verified_no_trade_dates.csv

      - name: Run factor attribution
        run: |
          python scripts/run_fluidq_backtest.py \
            --prices data/processed/adjusted/prices_adjusted_split_bonus.csv \
            --membership data/input/nifty500_membership.csv \
            --events data/input/verified_corporate_events.csv \
            --factor-weights "${{matrix.weights}}" \
            --outdir "results/factor_attribution/${{matrix.name}}"

      - name: Run subperiod analysis
        run: |
          python scripts/run_fluidq_subperiods.py \
            --portfolio "results/factor_attribution/${{matrix.name}}/portfolio_daily.csv" \
            --signals "results/factor_attribution/${{matrix.name}}/rebalance_signals.csv" \
            --outdir "results/factor_attribution/${{matrix.name}}/subperiods"

      - name: Upload attribution result
        uses: actions/upload-artifact@v4
        with:
          name: fluidq-factor-attribution-${{matrix.name}}
          path: "results/factor_attribution/${{matrix.name}}/"
          retention-days: 30

      
  factor_diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download price-integrity artifact
        uses: actions/download-artifact@v5
        with:
          name: fluidq-price-integrity-${{ inputs.integrity_run_id }}
          path: integrity_artifact
          run-id: ${{ inputs.integrity_run_id }}
          github-token: ${{secrets.GITHUB_TOKEN}}
      - name: Restore backtest inputs
        run: |
          test -s integrity_artifact/data/input/verified_no_trade_dates.csv
          test -s integrity_artifact/results/price_quality/price_gap_readiness.json
          python - <<'PY'
          import json
          p = "integrity_artifact/results/price_quality/price_gap_readiness.json"
          r = json.load(open(p))
          if r.get("status") != "PASS_PRICE_GAPS" or r.get("price_gap_integrity") != "PASS":
              raise SystemExit("Refusing to backtest: price-gap readiness gate did not pass")
          print("Price-gap gate passed; research remains provisional:", r.get("limitations"))
          PY
          mkdir -p data/processed/adjusted data/input results/factor_diagnostics
          cp integrity_artifact/data/processed/adjusted/prices_adjusted_split_bonus.csv data/processed/adjusted/
          mkdir -p data/input
          cp integrity_artifact/data/input/verified_no_trade_dates.csv data/input/verified_no_trade_dates.csv
          cp integrity_artifact/data/input/nifty500_membership.csv data/input/
          cp integrity_artifact/data/input/verified_no_trade_dates.csv data/input/verified_no_trade_dates.csv
      - name: Run factor diagnostics
        run: |
          python scripts/run_fluidq_factor_diagnostics.py \
            --prices data/processed/adjusted/prices_adjusted_split_bonus.csv \
            --membership data/input/nifty500_membership.csv \
            --outdir results/factor_diagnostics
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: fluidq-factor-diagnostics
          path: results/factor_diagnostics/
          retention-days: 30
