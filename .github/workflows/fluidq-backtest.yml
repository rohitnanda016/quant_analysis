name: FLUID-Q V1 Backtest

on:
  workflow_dispatch:
    inputs:
      integrity_run_id:
        description: "Price-integrity artifact run ID that passed the price-gap gate"
        required: true
permissions:
  contents: read
  actions: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download price-integrity artifact
        uses: actions/download-artifact@v5
        with:
          name: fluidq-price-integrity-${{ inputs.integrity_run_id }}
          path: integrity_artifact
          run-id: ${{ inputs.integrity_run_id }}
          github-token: ${{secrets.GITHUB_TOKEN}}
      - name: Restore backtest inputs
        run: |
          test -s integrity_artifact/data/input/verified_no_trade_dates.csv
          test -s integrity_artifact/results/price_quality/price_gap_readiness.json
          python - <<'PY'
          import json
          p = "integrity_artifact/results/price_quality/price_gap_readiness.json"
          r = json.load(open(p))
          if r.get("status") != "PASS_PRICE_GAPS" or r.get("price_gap_integrity") != "PASS":
              raise SystemExit("Refusing to backtest: price-gap readiness gate did not pass")
          print("Price-gap gate passed; research remains provisional:", r.get("limitations"))
          PY
          mkdir -p data/processed/adjusted data/input results/backtest
          cp integrity_artifact/data/processed/adjusted/prices_adjusted_split_bonus.csv data/processed/adjusted/
          mkdir -p data/input
          cp integrity_artifact/data/input/verified_no_trade_dates.csv data/input/verified_no_trade_dates.csv
          cp integrity_artifact/data/input/nifty500_membership.csv data/input/
          cp integrity_artifact/data/input/verified_no_trade_dates.csv data/input/verified_no_trade_dates.csv
      - name: Run FLUID-Q V1 backtest
        run: |
          python scripts/run_fluidq_backtest.py \
            --prices data/processed/adjusted/prices_adjusted_split_bonus.csv \
            --membership data/input/nifty500_membership.csv \
            --events data/input/verified_corporate_events.csv \
            --outdir results/backtest
      - name: Validate FLUID-Q V1 backtest
        run: python scripts/validate_fluidq_backtest.py
      - name: Audit execution and turnover
        run: |
          python scripts/audit_execution_turnover.py \
            --signals results/backtest/rebalance_signals.csv \
            --portfolio results/backtest/portfolio_daily.csv \
            --out results/backtest/execution_turnover_audit.json
      - name: Compare against Nifty 500 TRI
        run: |
          python scripts/compare_fluidq_benchmark.py \
            --portfolio results/backtest/portfolio_daily.csv \
            --signals results/backtest/rebalance_signals.csv \
            --outdir results/backtest
      - name: Run sub-period and regime analysis
        run: |
          python scripts/run_fluidq_subperiods.py \
            --portfolio results/backtest/portfolio_daily.csv \
            --signals results/backtest/rebalance_signals.csv \
            --outdir results/backtest/subperiods
      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: fluidq-v1-backtest-${{github.run_id}}
          path: results/backtest/
          retention-days: 30
