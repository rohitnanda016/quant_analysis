name: FLUID-Q Research Pipeline

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Pipeline stage"
        required: true
        default: "identity-audit"
        type: choice
        options:
          - identity-audit
          - stage-a-audit
      start_date:
        description: "Start date"
        required: true
        default: "2022-01-03"
      end_date:
        description: "End date"
        required: true
        default: "2022-07-29"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas
      - name: Validate repository
        run: |
          test -f scripts/build_v6_2_identity.py
          test -f scripts/audit_v6_2_gaps.py
          test -f data/input/verified_symbol_map.csv
      - name: Create result directory
        run: mkdir -p results/latest
      - name: Run identity/audit pipeline
        run: |
          if [ -f data/processed/prices_nifty500_raw.csv ] && [ -f data/input/nifty500_membership.csv ]; then
            python scripts/build_v6_2_identity.py --prices data/processed/prices_nifty500_raw.csv --membership data/input/nifty500_membership.csv --symbol-map data/input/verified_symbol_map.csv
            python scripts/audit_v6_2_gaps.py --prices data/processed/v6_2/prices_with_canonical_symbol.csv --membership data/processed/v6_2/membership_with_canonical_symbol.csv --outdir results/latest
          else
            echo "Stage-A datasets are not committed; no data will be fabricated."
          fi
      - name: Write run metadata
        run: |
          python - <<'PY'
          import json,os,subprocess
          m={"pipeline":"FLUID-Q Research Pipeline","stage":os.environ.get("INPUT_STAGE"),"start_date":os.environ.get("INPUT_START_DATE"),"end_date":os.environ.get("INPUT_END_DATE"),"git_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"workflow_run":os.environ.get("GITHUB_RUN_ID")}
          open("results/latest/run_metadata.json","w").write(json.dumps(m,indent=2))
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: fluidq-research-results
          path: results/latest/
          if-no-files-found: warn
      - name: Commit compact results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/latest/
          if git diff --cached --quiet; then echo "No result changes"; else git commit -m "chore: update FLUID-Q research results"; git push; fi