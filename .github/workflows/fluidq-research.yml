name: FLUID-Q Research Pipeline

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Research stage"
        required: true
        default: full-history
        type: choice
        options: [full-history, repair-full-history, stage-a, identity-audit]
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: 2014-01-01
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: 2026-08-31
      base_run_id:
        description: "Completed full-history run to repair (required for repair-full-history)"
        required: false
        default: 36806513002

permissions:
  contents: write
  actions: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit test legacy and UDiFF archive parsing
        run: python -m unittest discover -s tests -p "test_price_gap_bhavcopy_parser.py"

      - name: Validate run parameters
        env:
          STAGE: ${{ inputs.stage }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          BASE_RUN_ID: ${{ inputs.base_run_id }}
        run: |
          python - <<'PY'
          import os
          from datetime import date

          stage = os.environ["STAGE"]
          start = os.environ["START_DATE"]
          end = os.environ["END_DATE"]

          try:
              start_d = date.fromisoformat(start)
              end_d = date.fromisoformat(end)
          except ValueError as e:
              raise SystemExit(f"Invalid date; expected YYYY-MM-DD: {e}")

          if start_d > end_d:
              raise SystemExit(f"Start date {start} is after end date {end}")

          if stage in ("full-history","repair-full-history"):
              if start != "2014-01-01" or end != "2026-08-31":
                  raise SystemExit("full-history and repair-full-history must use exactly 2014-01-01 through 2026-08-31")
          if stage == "repair-full-history" and not os.environ.get("BASE_RUN_ID","").strip():
              raise SystemExit("repair-full-history requires base_run_id")

          print(f"RUN PARAMETERS: stage={stage}, start={start}, end={end}")
          PY

      - name: Prepare historical membership
        if: ${{ inputs.stage == 'stage-a' || inputs.stage == 'full-history' || inputs.stage == 'repair-full-history' }}
        run: |
          mkdir -p data/input data/raw results/latest
          curl -L --fail --retry 4 https://raw.githubusercontent.com/aditya-jha/nse-historical-membership/main/index_history/data/index_membership_history.csv -o data/input/membership_full.csv
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv("data/input/membership_full.csv")
          x.columns=[str(c).strip().lower().replace(" ","_") for c in x.columns]
          x=x[x.index_name.astype(str).str.strip().str.lower()=="nifty 500"]
          x.to_csv("data/input/nifty500_membership_source.csv",index=False)
          print("source rows",len(x),"source symbols",x.symbol.nunique())
          PY
          python scripts/build_historical_membership.py \
            --membership data/input/nifty500_membership_source.csv \
            --out data/input/nifty500_membership.csv \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}"

      - name: Probe NSE historical symbol endpoints
        if: ${{ inputs.stage == 'stage-a' || inputs.stage == 'full-history' }}
        run: |
          python scripts/probe_nse_symbols.py --start 23-06-2022 --end 30-06-2022 --out results/latest/nse_symbol_probe.json

      - name: Download prior full-history artifact
        if: ${{ inputs.stage == 'repair-full-history' }}
        uses: actions/download-artifact@v5
        with:
          name: fluidq-full-history-${{ inputs.base_run_id }}
          path: base_artifact
          run-id: ${{ inputs.base_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore prior dataset for repair
        if: ${{ inputs.stage == 'repair-full-history' }}
        run: |
          mkdir -p data/raw
          cp base_artifact/data/raw/stage_a_prices.csv data/raw/stage_a_prices.csv
          cp base_artifact/data/raw/stage_a_prices.audit.json data/raw/stage_a_prices.audit.json
          python -c "import json; x=json.load(open('data/raw/stage_a_prices.audit.json')); print('BASE ROWS:',x.get('rows')); print('FAILED SYMBOLS:',x.get('failed_symbols')); print('FAILED CHUNKS:',x.get('failed_chunks'))"

      - name: Repair only failed chunks
        if: ${{ inputs.stage == 'repair-full-history' }}
        run: |
          python scripts/repair_failed_chunks.py --prices data/raw/stage_a_prices.csv --out data/raw/stage_a_prices.csv --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}" --symbols "SGPC,SHTV" --chunk-days 365 --sleep 3 --retries 4

      - name: Download NSE prices
        if: ${{ inputs.stage == 'stage-a' || inputs.stage == 'full-history' }}
        run: |
          echo "Downloading NSE prices for ${{ inputs.start_date }} through ${{ inputs.end_date }}"
          python scripts/download_stage_a.py \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            --membership data/input/nifty500_membership.csv \
            --out data/raw/stage_a_prices.csv \
            --sleep 0.2 --chunk-days 365 --workers 6

      - name: Repair flagged historical gaps
        if: ${{ inputs.stage == 'stage-a' }}
        run: |
          python scripts/repair_flagged_gaps.py \
            --input data/raw/stage_a_prices.csv \
            --output data/raw/stage_a_prices.csv \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            --chunk-days 31 --sleep 0.5

      - name: Repair long internal price gaps from official NSE daily bhavcopy
        if: ${{ inputs.stage == 'stage-a' || inputs.stage == 'full-history' || inputs.stage == 'repair-full-history' }}
        run: |
          mkdir -p data/input results/latest
          python scripts/repair_price_gaps_bhavcopy.py \
            --prices data/raw/stage_a_prices.csv \
            --out data/raw/stage_a_prices_repaired.csv \
            --no-trade-out data/input/verified_no_trade_dates.csv \
            --exceptions-out data/input/unresolved_gap_exceptions.csv \
            --report results/latest/bhavcopy_gap_repair.json \
            --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}" \
            --min-gap-sessions 10 --sleep 0.15 --retries 3 --workers 3 --min-bhavcopy-eq-rows 500
          mv data/raw/stage_a_prices_repaired.csv data/raw/stage_a_prices.csv

      - name: Audit raw price quality
        id: raw_audit
        continue-on-error: true
        if: ${{ inputs.stage == 'stage-a' || inputs.stage == 'full-history' || inputs.stage == 'repair-full-history' }}
        run: python scripts/audit_price_quality.py --prices data/raw/stage_a_prices.csv --outdir results/price_quality

      - name: Build V6.2 identity
        continue-on-error: true
        if: ${{ inputs.stage == 'stage-a' || inputs.stage == 'full-history' || inputs.stage == 'repair-full-history' }}
        run: |
          python scripts/build_v6_2_identity.py \
            --prices data/raw/stage_a_prices.csv \
            --membership data/input/nifty500_membership.csv \
            --symbol-map data/input/verified_symbol_map.csv

      - name: Audit coverage
        id: audit_coverage
        continue-on-error: true
        if: ${{ inputs.stage == 'stage-a' || inputs.stage == 'full-history' || inputs.stage == 'repair-full-history' }}
        run: |
          python scripts/audit_v6_2_gaps.py \
            --prices data/processed/v6_2/prices_with_canonical_symbol.csv \
            --membership data/processed/v6_2/membership_with_canonical_symbol.csv \
            --outdir results/latest

      - name: Gate source gaps and publish an explicit readiness report
        id: gap_gate
        if: ${{ inputs.stage == 'stage-a' || inputs.stage == 'full-history' || inputs.stage == 'repair-full-history' }}
        run: |
          python scripts/audit_price_gap_readiness.py \
            --prices data/raw/stage_a_prices.csv \
            --repair-report results/latest/bhavcopy_gap_repair.json \
            --verified-no-trade data/input/verified_no_trade_dates.csv \
            --symbol-map data/input/verified_symbol_map.csv \
            --report results/latest/price_gap_readiness.json

      - name: Metadata
        run: |
          python - <<'PY'
          import json,os,subprocess
          m={
              "stage": os.environ["STAGE"],
              "start_date": os.environ["START_DATE"],
              "end_date": os.environ["END_DATE"],
              "git_commit": subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
              "workflow_run": os.environ["GITHUB_RUN_ID"]
          }
          json.dump(m,open("results/latest/run_metadata.json","w"),indent=2)
          PY
        env:
          STAGE: ${{ inputs.stage }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}

      - name: Upload diagnostic artifact even when readiness is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluidq-diagnostic-${{ inputs.stage }}-${{ github.run_id }}
          path: |
            data/raw/
            data/processed/v6_2/
            data/input/nifty500_membership.csv
            data/input/verified_no_trade_dates.csv
            data/input/unresolved_gap_exceptions.csv
            data/input/verified_symbol_map.csv
            results/latest/
            results/price_quality/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish research-input artifact only when source gate passes
        if: ${{ (inputs.stage != 'stage-a' && inputs.stage != 'full-history' && inputs.stage != 'repair-full-history') || (steps.gap_gate.outcome == 'success' && steps.audit_coverage.outcome == 'success') }}
        uses: actions/upload-artifact@v4
        with:
          name: fluidq-${{ inputs.stage }}-${{ github.run_id }}
          path: |
            data/raw/
            data/processed/v6_2/
            data/input/nifty500_membership.csv
            data/input/verified_no_trade_dates.csv
            data/input/verified_symbol_map.csv
            results/latest/
            results/price_quality/
          if-no-files-found: error
          retention-days: 30

      - name: Commit compact results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/latest/
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "chore: update FLUID-Q research results"
            git push
          fi
