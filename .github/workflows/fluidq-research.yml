name: FLUID-Q Research Pipeline

on:
  push:
    paths:
      - 'scripts/download_stage_a.py'
      - 'scripts/probe_nse_symbols.py'
      - 'scripts/build_v6_2_identity.py'
      - 'scripts/build_historical_membership.py'
      - 'scripts/audit_v6_2_gaps.py'
      - 'scripts/repair_flagged_gaps.py'
      - '.github/workflows/fluidq-research.yml'
  workflow_dispatch:
    inputs:
      stage:
        required: true
        default: stage-a
        type: choice
        options: [stage-a, identity-audit]
      start_date:
        required: true
        default: 2022-01-03
      end_date:
        required: true
        default: 2022-07-29

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests
      - name: Prepare historical membership
        if: ${{ github.event_name == 'push' || inputs.stage == 'stage-a' }}
        run: |
          mkdir -p data/input data/raw results/latest
          curl -L --fail --retry 4 https://raw.githubusercontent.com/aditya-jha/nse-historical-membership/main/index_history/data/index_membership_history.csv -o data/input/membership_full.csv
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv("data/input/membership_full.csv")
          x.columns=[str(c).strip().lower().replace(" ","_") for c in x.columns]
          x=x[x.index_name.astype(str).str.strip().str.lower()=="nifty 500"]
          x.to_csv("data/input/nifty500_membership_source.csv",index=False)
          print("source rows",len(x),"source symbols",x.symbol.nunique())
          PY
          python scripts/build_historical_membership.py \
            --membership data/input/nifty500_membership_source.csv \
            --out data/input/nifty500_membership.csv \
            --start "${{ inputs.start_date || '2022-01-03' }}" \
            --end "${{ inputs.end_date || '2022-07-29' }}"
      - name: Probe NSE historical symbol endpoints
        if: ${{ github.event_name == 'push' || inputs.stage == 'stage-a' }}
        run: |
          python scripts/probe_nse_symbols.py --start 23-06-2022 --end 30-06-2022 --out results/latest/nse_symbol_probe.json
      - name: Download Stage-A NSE prices
        if: ${{ github.event_name == 'push' || inputs.stage == 'stage-a' }}
        run: |
          python scripts/download_stage_a.py --start "${{ inputs.start_date || '2022-01-03' }}" --end "${{ inputs.end_date || '2022-07-29' }}" --membership data/input/nifty500_membership.csv --out data/raw/stage_a_prices.csv --sleep 1
      - name: Repair flagged historical gaps
        if: ${{ github.event_name == 'push' || inputs.stage == 'stage-a' }}
        run: |
          python scripts/repair_flagged_gaps.py --input data/raw/stage_a_prices.csv --output data/raw/stage_a_prices.csv --start "${{ inputs.start_date || '2022-01-03' }}" --end "${{ inputs.end_date || '2022-07-29' }}" --chunk-days 31 --sleep 0.5
      - name: Build V6.2 identity
        run: |
          python scripts/build_v6_2_identity.py --prices data/raw/stage_a_prices.csv --membership data/input/nifty500_membership.csv --symbol-map data/input/verified_symbol_map.csv
      - name: Audit coverage
        run: |
          python scripts/audit_v6_2_gaps.py --prices data/processed/v6_2/prices_with_canonical_symbol.csv --membership data/processed/v6_2/membership_with_canonical_symbol.csv --outdir results/latest
      - name: Metadata
        run: |
          python - <<'PY'
          import json,os,subprocess
          m={"stage":os.environ["STAGE"] or "stage-a","start_date":os.environ["START_DATE"] or "2022-01-03","end_date":os.environ["END_DATE"] or "2022-07-29","git_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"workflow_run":os.environ["GITHUB_RUN_ID"]}
          json.dump(m,open("results/latest/run_metadata.json","w"),indent=2)
          PY
        env:
          STAGE: ${{ inputs.stage }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
      - uses: actions/upload-artifact@v4
        with:
          name: fluidq-${{ inputs.stage || 'stage-a' }}-${{ github.run_id }}
          path: |
            data/raw/
            data/processed/v6_2/
            results/latest/
          retention-days: 30
      - name: Commit compact results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/latest/
          if git diff --cached --quiet; then echo "No result changes"; else git commit -m "chore: update FLUID-Q research results"; git push; fi

