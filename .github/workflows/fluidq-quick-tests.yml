name: FLUID-Q Fast Validation

on:
  push:
    branches: [v1.2-factor-attribution]
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/fluidq-quick-tests.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/fluidq-quick-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
